services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: antar-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-antar}
      POSTGRES_USER: ${POSTGRES_USER:-antar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - antar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antar} -d ${POSTGRES_DB:-antar}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: antar-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  antar_postgres_data:
